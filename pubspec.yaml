name: pico_snap
description: 可愛的韓系拍貼 App：四格拍貼、拍立得拼貼與貼紙裝飾。
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  audioplayers: ^6.7.1
  camera: ^0.12.0+2
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  gal: ^2.3.3
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  sensors_plus: ^7.1.1
  share_plus: ^13.3.1
  video_player: ^2.11.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/samples/
    - assets/stickers/
    - assets/templates/
    - assets/sticker_sheets/
    - assets/instant/
    - assets/backdrops/
    - assets/luts/
    - assets/fonts/ChenYuluoyan-OFL.txt
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-500.ttf
          weight: 500
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800
        - asset: assets/fonts/Nunito-900.ttf
          weight: 900
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-600.ttf
          weight: 600
    # 辰宇落雁體 2.0 細體, SIL OFL 1.1 (assets/fonts/ChenYuluoyan-OFL.txt):
    # shipped unmodified, the name is reserved for modified versions.
    - family: ChenYuluoyan
      fonts:
        - asset: assets/fonts/ChenYuluoyan-2.0-Thin.ttf
